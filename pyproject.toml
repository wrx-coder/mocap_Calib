[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-calib-workspace"
version = "0.0.0"
description = "Skeleton workspace for static robot camera-to-mocap spatial calibration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6"]

[project.scripts]
mocap-calib = "dc_calib.cli:main"

# ROS bag decoding/model inference are intentionally outside the offline core.
[project.optional-dependencies]
calibration = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dc_mocap*", "dc_calib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py also supports older system pytest without installation.
