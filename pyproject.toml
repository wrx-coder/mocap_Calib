[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mocap-calib-workspace"
version = "0.0.0"
description = "Skeleton workspace for static robot camera-to-mocap spatial calibration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

# Suggested future dependencies; not installed or locked by this scaffold.
[project.optional-dependencies]
calibration = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dc_mocap*", "dc_calib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
